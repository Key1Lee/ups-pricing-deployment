[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ups-pricing-deployment"
version = "0.1.0"
description = "Local synthetic shipping acceptance and pricing learning project"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2",
  "xgboost>=3.0,<4", "matplotlib>=3.9,<4", "joblib>=1.4,<2",
  "dagster>=1.10,<2", "dagster-webserver>=1.10,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
shipping = "shipping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running Docker daemon and image"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
